version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: lpbot-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.0
    container_name: lpbot-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=lpbot123
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped

  # Metrics endpoint for lpbot (exposed by the app on :9090)
  # Note: Run lpbot with metrics_addr=":9090" to expose metrics

volumes:
  prometheus_data:
  grafana_data: