name: Audit regression (gpt-6pro R01-R08)
on:
  push:
    branches:
      - feat/prd-v2.1-m0-shadow
      - feat/supabase-postgres-deployment
  pull_request:
    branches:
      - feat/prd-v2.1-m0-shadow
  schedule:
    - cron: "37 4 * * *"

jobs:
  audit-repro:
    name: audit_repro.py R01-R08 (repo AST extract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify audit_repro.py is vendored
        run: |
          test -f tools/audit_repro/audit_repro.py
      - name: Run audit_repro.py against THIS checkout
        env:
          GITHUB_HEAD_SHA: ${{ github.sha }}
        run: |
          cd ${{ github.workspace }}
          python tools/audit_repro/audit_repro.py \
            --repo "$GITHUB_WORKSPACE" \
            --allow-other-head \
            --json-out audit_results.json
          cat audit_results.json
      - name: Assert mode, HEAD, and zero defects
        run: |
          python -c "
import json, os, subprocess
d = json.load(open('audit_results.json'))
src = d.get('source', {})
mode = src.get('mode')
head = src.get('head')
expected_head = os.environ['GITHUB_HEAD_SHA']
defects = d.get('defects_reproduced', -1)
probe_errors = d.get('probe_errors', -1)

assert mode == 'AST_EXTRACTED_CHECKOUT_FUNCTIONS_WITH_TEST_SHIMS', \
    f'CI ran wrong mode: {mode} (want AST_EXTRACTED_CHECKOUT_FUNCTIONS_WITH_TEST_SHIMS). ' \
    f'Missing --repo is the typical cause; default is REDUCED_REFERENCE_MODEL pinned to old commit.'
assert head == expected_head, \
    f'AST head {head} != github.sha {expected_head}; --allow-other-head is required when HEAD != PIN'
assert probe_errors == 0, f'probe_errors={probe_errors}'
assert defects == 0, f'defects_reproduced={defects}; audit findings regressed'
print(f'OK: mode={mode}, head={head[:12]}, defects={defects}')
"