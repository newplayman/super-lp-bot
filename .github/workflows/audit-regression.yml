name: Audit regression (gpt-6pro R01-R08)
on:
  push:
    branches:
      - feat/prd-v2.1-m0-shadow
      - feat/supabase-postgres-deployment
  pull_request:
    branches:
      - feat/prd-v2.1-m0-shadow
  schedule:
    - cron: "37 4 * * *"

jobs:
  audit-repro:
    name: audit_repro.py R01-R08 (repo AST extract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify audit_repro.py is vendored
        run: |
          test -f tools/audit_repro/audit_repro.py
      - name: Run audit_repro.py against THIS checkout
        env:
          GITHUB_HEAD_SHA: ${{ github.sha }}
        run: |
          cd ${{ github.workspace }}
          python3 tools/audit_repro/audit_repro.py \
            --repo "$GITHUB_WORKSPACE" \
            --allow-other-head \
            --json-out audit_results.json
          cat audit_results.json
      # The assert step writes its Python body to a file via a single-quoted
      # heredoc so YAML indentation in the block scalar never affects the
      # parsed Python.  GITHUB_HEAD_SHA is passed via the step env (each step
      # has its own env scope; it does NOT inherit from the prior step).
      - name: Assert mode, HEAD, and zero defects
        env:
          GITHUB_HEAD_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          cat > /tmp/assert_audit_repro.py <<'PYEOF'
          import json
          import os
          import sys

          with open("audit_results.json", "r", encoding="utf-8") as fh:
              d = json.load(fh)

          # v1 schema contract: schema_version / run_id / head_sha / mode are
          # top-level. counts.defects_reproduced / counts.probe_errors are
          # mirrored to top-level `defects_reproduced` / `probe_errors` so a
          # single parser can read either path; assert both are consistent.
          schema_version = d.get("schema_version")
          if schema_version != "audit_repro/1":
              sys.stderr.write(
                  "FAIL: schema_version=%r; expected audit_repro/1. "
                  "Update the assert step to the matching version.\n" % schema_version
              )
              sys.exit(2)

          run_id = d.get("run_id")
          if not run_id:
              sys.stderr.write("FAIL: missing run_id at top level\n")
              sys.exit(2)

          head = d.get("head_sha")
          expected_head = os.environ.get("GITHUB_HEAD_SHA") or os.environ.get("GITHUB_SHA", "")
          if not expected_head or head != expected_head:
              sys.stderr.write(
                  "FAIL: head_sha %r != github.sha %r; "
                  "--allow-other-head is required when HEAD != PIN.\n"
                  % (head, expected_head)
              )
              sys.exit(2)

          mode = d.get("mode")
          if mode != "AST_EXTRACTED_CHECKOUT_FUNCTIONS_WITH_TEST_SHIMS":
              sys.stderr.write(
                  "FAIL: audit_repro ran in mode %r, "
                  "expected AST_EXTRACTED_CHECKOUT_FUNCTIONS_WITH_TEST_SHIMS. "
                  "Common cause: --repo / --allow-other-head missing.\n" % mode
              )
              sys.exit(2)

          # top-level github.sha must equal GITHUB_SHA so external consumers
          # can cross-check without re-reading workflow env.
          gh = d.get("github") or {}
          gh_sha = gh.get("sha")
          if gh_sha != expected_head:
              sys.stderr.write(
                  "FAIL: github.sha=%r != github.sha env=%r\n" % (gh_sha, expected_head)
              )
              sys.exit(2)

          counts = d.get("counts") or {}
          defects_top = d.get("defects_reproduced", -1)
          probe_top = d.get("probe_errors", -1)
          if defects_top != counts.get("defects_reproduced"):
              sys.stderr.write(
                  "FAIL: top-level defects_reproduced=%r != counts.defects_reproduced=%r\n"
                  % (defects_top, counts.get("defects_reproduced"))
              )
              sys.exit(2)
          if probe_top != counts.get("probe_errors"):
              sys.stderr.write(
                  "FAIL: top-level probe_errors=%r != counts.probe_errors=%r\n"
                  % (probe_top, counts.get("probe_errors"))
              )
              sys.exit(2)

          defects = counts.get("defects_reproduced")
          probe_errors = counts.get("probe_errors")
          if probe_errors != 0:
              sys.stderr.write("FAIL: probe_errors=%d\n" % probe_errors)
              sys.exit(2)
          if defects != 0:
              sys.stderr.write(
                  "FAIL: defects_reproduced=%d; audit findings regressed.\n" % defects
              )
              sys.exit(2)
          print("OK: schema_version=%s run_id=%s mode=%s head=%s defects=%d probe_errors=%d github.sha=%s" % (
              schema_version, run_id, mode, (head or "")[:12], defects, probe_errors, (gh_sha or "")[:12],
          ))
          PYEOF
          python3 /tmp/assert_audit_repro.py
