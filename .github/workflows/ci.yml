name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Build all tags
        run: |
          make build-dryrun
          make build-shadow
          make build-live
          make backtest
          make build-migrate-postgres

      - name: Migration sync check
        # Drift guard for the two postgres migration directories
        # (migrations/postgres/ vs internal/adapters/store/postgres/migrator/sql/).
        # Cheap, network-free; safe to run on every PR.
        run: make check-postgres-migrations-sync

      - name: Unit tests
        run: make test

      - name: Property tests
        run: make test-property

      - name: Test files unmodified check
        run: |
          set -e
          BASE=$(git merge-base origin/main HEAD || echo origin/main)
          if git diff "$BASE" -- '*_test.go' | grep -E '^-[^-]' | grep -v '^---'; then
            echo "ERROR: Cannot delete/modify *_test.go"
            exit 1
          fi
  advisory-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install advisory tools
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Dependency audit
        run: |
          echo "=== Checking for dependency updates ==="
          go list -m -u all
          echo "=== Running govet ==="
          go vet ./...
          echo "=== Running govulncheck ==="
          "$(go env GOPATH)"/bin/govulncheck ./...
  fork-tests:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event.schedule == '0 6 * * *' || contains(github.event.head_commit.message, '[run-fork]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests
        env:
          BASE_RPC_PRIMARY: ${{ secrets.BASE_RPC_PRIMARY }}
          SOL_RPC_PRIMARY:  ${{ secrets.SOL_RPC_PRIMARY }}
        run: make test-fork

  chaos-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Chaos tests
        run: make test-chaos

  python-rh-tests:
    name: RH Python tests (no secrets, no RPC)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 git rev-list 历史（test 用了 git show 之类）
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist  # 既有 pytest.ini 配置的最小集
      - name: Run RH Python unit + integration tests
        env:
          # 显式禁止任何 RPC/secret 注入——验证是"无密钥、无 RPC"模式
          RH_RPC_PRIMARY: ""
          RH_RPC_SECONDARY: ""
          DATABASE_URL: ""
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -q --tb=short -p no:cacheprovider
      - name: Run daemon entry-point integration subset
        # 不跑完整 daemon（需要 72h），只跑 _run_episode_persisted 等离线确定性入口
        env:
          RH_RPC_PRIMARY: ""
          RH_RPC_SECONDARY: ""
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -q -k "episode_persisted or daemon or reconciliation or graduation or readiness" \
            --tb=short -p no:cacheprovider
