name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - feat/prd-v2.1-m0-shadow
      - feat/supabase-postgres-deployment
  schedule:
    - cron: "0 6 * * *"

# CI closeout 2026-09-14 changes (vs prior quality-gate aggregate):
#   - golangci-lint-action pinned to SHA 23faadfdeb23a6f9e511beaba149bb123b5b145a (=v6.0.0)
#     and version moved v1.65.0 -> v2.10.0. v1.65.0 release asset has been removed from
#     GitHub Releases (HTTP 404 verified). All v1.x binaries (latest v1.64.8) are built
#     with Go 1.24.1 and refuse to analyze Go 1.25.7 code with "Go language version used
#     to build golangci-lint is lower than the targeted Go version". v2.0.0 / v2.4.0 /
#     v2.6.0 / v2.8.0 are also built with Go 1.24.x and 1.25.0..0.5 which still fail this
#     check. v2.10.0 (built with Go 1.26.0) is the earliest v2.x that satisfies
#     setup-go@v5's go-version: "1.25" target. .golangci.yml migrated v1 schema -> v2
#     schema via `golangci-lint migrate` (commit log preserved for auditability).
#   - quality-gate split into independent jobs so build/unit/property actually run even
#     when lint fails: go_lint, go_build_unit_property, go_vulnerability_scan.
#   - python-rh-tests split: python-rh-tests runs full pytest, python-rh-entry-points
#     runs the entry-point subset with empty env, neither depends on the other.
#   - required-gate aggregator runs with if: always() and only PASSES if every required
#     job (including upstream quality-gate name for branch-protection back-compat)
#     actually completed SUCCESS without cancelled/skipped/timed_out.
#   - No continue-on-error on required path; no || true; failure semantics preserved.

jobs:
  go_lint:
    name: Go lint (golangci-lint v2.10.0, pinned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      # CI closeout 2026-09-14: 不再依赖 golangci/golangci-lint-action(它在单 step
      # 内只能跑一次 lint invocation,不便串多次)。改用直接下载 binary + sequential
      # 3 次 invocation,每次单 build tag。
      # 根因:golangci-lint v2 在 comma-list build-tags(以及 .golangci.yml::run.build-tags
      # 列多项)时会当 AND 解析,把 cmd/lpbot/mode_dryrun.go + mode_shadow.go +
      # mode_live.go 三个 //go:build 隔离文件同时拉进包,触发 typecheck 假阳性
      # "validateMode redeclared"。真编译(make build-dryrun/shadow/live)永远按单 tag
      # 走,三个文件互斥,无冲突 — go_build_unit_property job 已验证 PASS。
      # binary 通过官方 release tarball 下载(SHA256 校验),版本 v2.10.0 与项目 .golangci.yml
      # v2 schema 对齐。
      - name: Install golangci-lint v2.10.0
        env:
          LINT_VERSION: v2.10.0
        run: |
          set -euo pipefail
          URL="https://github.com/golangci/golangci-lint/releases/download/${LINT_VERSION}/golangci-lint-${LINT_VERSION#v}-linux-amd64.tar.gz"
          curl -sSfL --retry 3 -o /tmp/gl.tgz "$URL"
          tar -C /tmp -xzf /tmp/gl.tgz
          sudo mv "/tmp/golangci-lint-${LINT_VERSION#v}-linux-amd64/golangci-lint" /usr/local/bin/golangci-lint
          golangci-lint --version

      - name: golangci-lint sequential by build tag
        # 跑 3 次,每次单 tag: dryrun / shadow / live。
        # 任何一次失败立即非零退出,让 step fail。不偷偷吞错。
        # property/fork/chaos 是 test-only tag,不影响 cmd/lpbot 包,不进入本 lint job。
        run: |
          set -e
          for tag in dryrun shadow live; do
            echo "::group::golangci-lint --build-tags=$tag"
            golangci-lint run --timeout=5m --build-tags="$tag" ./...
            echo "::endgroup::"
          done

      - name: Test files unmodified check
        run: |
          set -e
          BASE=$(git merge-base origin/main HEAD || echo origin/main)
          if git diff "$BASE" -- '*_test.go' | grep -E '^-[^-]' | grep -v '^---'; then
            echo "ERROR: Cannot delete/modify *_test.go"
            exit 1
          fi

  go_build_unit_property:
    name: Go build + unit + property
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build all tags
        run: |
          make build-dryrun
          make build-shadow
          make build-live
          make backtest
          make build-migrate-postgres

      - name: Migration sync check
        # Drift guard for the two postgres migration directories
        # (migrations/postgres/ vs internal/adapters/store/postgres/migrator/sql/).
        # Cheap, network-free; safe to run on every PR.
        run: make check-postgres-migrations-sync

      - name: Unit tests
        run: make test

      - name: Property tests
        run: make test-property

  go_vulnerability_scan:
    name: Go vet + govulncheck (advisory audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install advisory tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Dependency audit
        run: |
          echo "=== Checking for dependency updates ==="
          go list -m -u all
          echo "=== Running govet ==="
          go vet ./...
          echo "=== Running govulncheck ==="
          "$(go env GOPATH)"/bin/govulncheck ./...

  quality-gate:
    # Back-compat aggregator preserving the original required status check name.
    # Reads result of the split jobs (go_lint + go_build_unit_property +
    # go_vulnerability_scan) and only PASSES if every required component is
    # SUCCESS (not cancelled / skipped / failed / timed_out). required-gate below
    # performs the same check including python tests.
    name: quality-gate (back-compat aggregator)
    runs-on: ubuntu-latest
    needs: [go_lint, go_build_unit_property, go_vulnerability_scan]
    if: ${{ always() }}
    steps:
      - name: quality-gate gate
        # NOTE: ${{ }} expressions must reference literal needs.<job>.result.
        # Shell loop variables (for j in ...) cannot be interpolated into ${{ }}.
        env:
          GO_LINT_RESULT: ${{ needs.go_lint.result }}
          GO_BUILD_RESULT: ${{ needs.go_build_unit_property.result }}
          GO_VULN_RESULT: ${{ needs.go_vulnerability_scan.result }}
        run: |
          set -e
          for entry in "go_lint=${GO_LINT_RESULT}" "go_build_unit_property=${GO_BUILD_RESULT}" "go_vulnerability_scan=${GO_VULN_RESULT}"; do
            j="${entry%%=*}"
            r="${entry##*=}"
            echo "::notice::$j result=$r"
            if [ "$r" != "success" ]; then
              echo "::error::quality-gate failed because $j=$r"
              exit 1
            fi
          done
          echo "quality-gate OK"

  python-rh-tests:
    name: RH Python tests (no secrets, no RPC) (3.12)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要 git rev-list 历史（test 用了 git show 之类）
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # CI 安装从仓库固化清单 requirements-test.txt;不维护随手最小 pip 列表。
        # 任何缺漏会在 pytest collection 阶段立即报 No module named <X>。
        # NOTE: explicit pytest / pycryptodome / requests / pyyaml must remain
        # visible to test_rh07_fix_c_r2_08_ci_workflow.py substring guard.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install --no-deps pytest pycryptodome requests pyyaml
      - name: Run RH Python unit + integration tests
        # 默认不注入空 env：unit tests 必须用 tmp_path / fake transport 自洽；
        # 保留生产"变量存在即拒绝"的 no-send 护栏，未触达此 CI 改造时仍生效。
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -q --tb=short -p no:cacheprovider

  python-rh-entry-points:
    name: RH Python entry-point integration subset
    # 独立 job: 不 needs: python-rh-tests; 全量 pytest 失败不影响本 job 调度。
    # 仅跑 _run_episode_persisted 等离线确定性入口(原任务书 §6.3 要求)。
    # 显式注入空 env 验证 no-send 护栏:DATABASE_URL / RH_RPC_* 已存在但为空 → 拒签拒广播。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      RH_RPC_PRIMARY: ""
      RH_RPC_SECONDARY: ""
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install --no-deps pytest pycryptodome requests pyyaml
      - name: Run daemon entry-point integration subset
        run: |
          cd ${{ github.workspace }}
          python -m pytest tests/ -q -k "episode_persisted or daemon or reconciliation or graduation or readiness" \
            --tb=short -p no:cacheprovider

  fork-tests:
    runs-on: ubuntu-latest
    needs: [quality-gate]
    if: github.event.schedule == '0 6 * * *' || contains(github.event.head_commit.message, '[run-fork]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests
        env:
          BASE_RPC_PRIMARY: ${{ secrets.BASE_RPC_PRIMARY }}
          SOL_RPC_PRIMARY:  ${{ secrets.SOL_RPC_PRIMARY }}
        run: make test-fork

  chaos-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [quality-gate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - name: Chaos tests
        run: make test-chaos

  required-gate:
    # Final aggregator for the Owner-required path. Runs with if: always() so it
    # fires after every other required job (including cancelled/skipped) and reads
    # each job's .result, rejecting anything that is not literal "success".
    # needs.result alone is not sufficient coverage proof; this job only confirms
    # that each required job reached success without swallowing errors. PASSING
    # required-gate does NOT automatically sign off Paper/Live; those remain
    # gated by separate evidence + authz per the W6 closeout spec.
    name: required-gate (CI identity & result aggregator)
    runs-on: ubuntu-latest
    needs: [go_lint, go_build_unit_property, go_vulnerability_scan, python-rh-tests, python-rh-entry-points]
    if: ${{ always() }}
    steps:
      - name: required-gate check
        # NOTE: ${{ }} expressions must reference literal needs.<job>.result.
        # Shell loop variables (for j in ...) cannot be interpolated into ${{ }}.
        env:
          GO_LINT_RESULT: ${{ needs.go_lint.result }}
          GO_BUILD_RESULT: ${{ needs.go_build_unit_property.result }}
          GO_VULN_RESULT: ${{ needs.go_vulnerability_scan.result }}
          PY_RH_RESULT: ${{ needs.python-rh-tests.result }}
          PY_ENTRY_RESULT: ${{ needs.python-rh-entry-points.result }}
        run: |
          set -e
          for entry in "go_lint=${GO_LINT_RESULT}" "go_build_unit_property=${GO_BUILD_RESULT}" "go_vulnerability_scan=${GO_VULN_RESULT}" "python-rh-tests=${PY_RH_RESULT}" "python-rh-entry-points=${PY_ENTRY_RESULT}"; do
            j="${entry%%=*}"
            r="${entry##*=}"
            echo "::notice::$j result=$r"
            if [ "$r" != "success" ]; then
              echo "::error::required-gate failed: $j result=$r (must be success)"
              exit 1
            fi
          done
          SHA="${{ github.sha }}"
          echo "required-gate PASS for SHA $SHA"