name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: tidy
        run: cd v3 && go mod tidy && git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
          working-directory: v3

      - name: Build all tags
        working-directory: v3
        run: |
          make build-dryrun
          make build-shadow
          make build-live
          make backtest

      - name: Unit tests
        working-directory: v3
        run: make test

      - name: Property tests
        working-directory: v3
        run: make test-property

      - name: Test files unmodified check
        run: |
          set -e
          BASE=$(git merge-base origin/main HEAD || echo origin/main)
          if git diff "$BASE" -- 'v3/**/*_test.go' | grep -E '^-[^-]' | grep -v '^---'; then
            echo "ERROR: 不允许删/改 *_test.go（改测试需独立 PR 先合入）"
            exit 1
          fi

  fork-tests:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.event.schedule == '0 6 * * *' || contains(github.event.head_commit.message, '[run-fork]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Fork tests
        working-directory: v3
        env:
          BASE_RPC_PRIMARY: ${{ secrets.BASE_RPC_PRIMARY }}
          SOL_RPC_PRIMARY:  ${{ secrets.SOL_RPC_PRIMARY }}
        run: make test-fork

  chaos-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - working-directory: v3
        run: make test-chaos
