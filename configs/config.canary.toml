[mode]
expected = "live"

[platform]
log_level = "info"
metrics_addr = ":9092"
dashboard_token = "${DASHBOARD_TOKEN}"

[chains.base]
rpc_primary = "${BASE_RPC_PRIMARY}"
rpc_fallback = ["${BASE_RPC_FALLBACK}"]
ws = "${BASE_WS}"
mev = "flashbots-protect"
confirmations = 10

[chains.solana]
rpc_primary = "${SOL_RPC_PRIMARY}"
rpc_fallback = []
ws = ""
mev = "none"
confirmations = 1
commitment = "processed"

[store]
backend = "postgres"
postgres_dsn = "${POSTGRES_DSN}"

[redis]
url = "${REDIS_URL}"
prefix = "lpbot-canary"
heartbeat_interval_seconds = 15
heartbeat_ttl_seconds = 60

[wallet]
backend = "keystore"
keystore_path = "${HOME}/.lpbot/keystore-live.json"
passphrase = "${WALLET_PASSPHRASE}"

[bus]
backend = "inproc"

[execution]
backend = "native-rpc"
okx_api_key = "${OKX_API_KEY}"
okx_api_secret = "${OKX_API_SECRET}"
okx_api_passphrase = "${OKX_API_PASSPHRASE}"
okx_project_id = "${OKX_PROJECT_ID}"
npm_base_address = "${NPM_BASE_ADDRESS}"

[live]
enabled = false
canary = true
kill_switch = false
wallet_address = "${CANARY_WALLET_ADDRESS}"
allowed_chains = ["base"]
allowed_pools = ["0x6c561b446416e1a00e8e93e221854d6ea4171372"]
max_order_usd = 5
daily_loss_limit_usd = 10

[risk]
total_exposure_pct = 30
var_warn_pct = 8
var_kill_pct = 12
daily_dd_kill_pct = 5
weekly_dd_freeze_pct = 10

[tier_a]
max_per_pool_usd = 1000
il_stop_pct = 3
range_k_sigma = 1.75
min_hold_hours = 6

[tier_b]
max_per_pool_usd = 200
il_stop_pct = 5
range_k_sigma = 1.25
min_hold_hours = 2

[tier_c]
max_per_pool_usd = 50
il_stop_pct = 8
range_k_sigma = 0.75
min_hold_hours = 0.5
