[mode]
expected = "shadow"

[platform]
log_level = "info"
metrics_addr = ":9090"
# Optional: dashboard_token falls back to empty when DASHBOARD_TOKEN is unset,
# which makes the dashboard endpoint reject unauthenticated requests rather
# than crash on token validation.
dashboard_token = "${DASHBOARD_TOKEN:-}"

[alerting]
# Optional: telegram alerting is best-effort. Empty token disables alerting
# without crashing the runtime.
telegram_token = "${TELEGRAM_BOT_TOKEN:-}"
telegram_chat_id = "${TELEGRAM_CHAT_ID:-}"
min_interval_seconds = 60

[chains.base]
# Required for base chain reads; shadow can leave empty if base is skipped
# (R1 12h v3 ran with base skipped, so this is acceptable to be empty).
rpc_primary = "${BASE_RPC_PRIMARY:-}"
# Optional fallback list, supports comma-separated URLs, e.g. "https://a,https://b"
rpc_fallback = ["${BASE_RPC_FALLBACK:-}"]
ws = "${BASE_WS:-}"
confirmations = 10

[chains.solana]
# Required for solana chain reads; shadow can leave empty if solana is skipped.
rpc_primary = "${SOL_RPC_PRIMARY:-}"
commitment = "finalized"

[store]
backend = "postgres"
# Required: DSN. The platform/config loader resolves ${POSTGRES_DSN}
# with a fallback to ${DATABASE_URL} automatically (see
# internal/platform/config/config.go:resolveEnvValue). lpbot-shadow.service
# loads .env.postgres into the systemd manager environment, so either
# POSTGRES_DSN or DATABASE_URL in .env.postgres is sufficient.
postgres_dsn = "${POSTGRES_DSN}"

[redis]
url = "${REDIS_URL:-redis://127.0.0.1:6379/0}"
prefix = "lpbot"
heartbeat_interval_seconds = 15
heartbeat_ttl_seconds = 60

[bus]
backend = "inproc"

[risk]
total_exposure_pct = 30
var_warn_pct = 8
var_kill_pct = 12
daily_dd_kill_pct = 5
weekly_dd_freeze_pct = 10

[tier_a]
max_per_pool_usd = 1000
il_stop_pct = 3
range_k_sigma = 1.75
min_hold_hours = 6

[tier_b]
max_per_pool_usd = 200
il_stop_pct = 5
range_k_sigma = 1.25
min_hold_hours = 2

[tier_c]
max_per_pool_usd = 50
il_stop_pct = 8
range_k_sigma = 0.75
min_hold_hours = 0.5
