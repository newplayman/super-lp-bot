[mode]
expected = "shadow"

[platform]
log_level = "info"
metrics_addr = ":9090"

[chains.base]
rpc_primary = "${BASE_RPC_PRIMARY}"
rpc_fallback = ["${BASE_RPC_FALLBACK}"]
ws = "${BASE_WS}"
confirmations = 10

[chains.solana]
rpc_primary = "${SOL_RPC_PRIMARY}"
commitment = "finalized"

[store]
backend = "sqlite"
sqlite_path = "data/shadow.db"

[bus]
backend = "inproc"

[risk]
total_exposure_pct = 30
var_warn_pct = 8
var_kill_pct = 12
daily_dd_kill_pct = 5
weekly_dd_freeze_pct = 10

[tier_a]
max_per_pool_usd = 1000
il_stop_pct = 3
range_k_sigma = 1.75
min_hold_hours = 6

[tier_b]
max_per_pool_usd = 200
il_stop_pct = 5
range_k_sigma = 1.25
min_hold_hours = 2

[tier_c]
max_per_pool_usd = 50
il_stop_pct = 8
range_k_sigma = 0.75
min_hold_hours = 0.5
