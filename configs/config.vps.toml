# VPS Shadow Mode Configuration
# For testing the business loop on VPS

[mode]
expected = "shadow"

[store]
backend = "postgres"
postgres_dsn = "${DATABASE_URL}"

[platform]
log_level = "debug"

[alerting]
telegram_token = "${TELEGRAM_BOT_TOKEN}"
telegram_chat_id = "${TELEGRAM_CHAT_ID}"
min_interval_seconds = 60

[chains.base]
rpc_primary = ""  # Set your Base RPC endpoint
rpc_fallback = []

[chains.solana]
rpc_primary = ""  # Set your Solana RPC endpoint
